name: Release

# v1.2.3 태그를 푸시하거나, Actions 의 "Run workflow"(GitHub 앱 포함)를 main 에서 태그 칸을 비우고 누르면:
#   `release` 환경 승인 대기 → (수동 실행이면 그 브랜치의 VERSION 으로 v<버전> 태그를 만들어 올림) → 빌드(win-x64) → (선택) 코드 서명
#   → Velopack 패키지(Setup.exe · 포터블 zip · 업데이트 파일) → GitHub 릴리스
# 업데이트 서버는 없다. 앱은 GitHub 릴리스의 Velopack 파일을 읽는다.
# 테스트는 다시 돌리지 않는다 — 태그에 들어간 코드는 PR 에서 이미 CI 를 통과했다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "비워 두면 이 브랜치의 VERSION 으로 v<버전> 태그를 만들어 릴리스. 이미 있는 태그를 다시 만들 때만 입력 (예: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 태그 푸시면 그 태그, 수동 실행이면 실행한 브랜치 (태그 칸의 태그가 이미 있으면 아래에서 그 태그로 바꾼다)
          ref: ${{ github.ref }}
          fetch-depth: 0

      # 태그 정하기
      # - 태그 푸시: 그 태그
      # - 수동 실행, 태그 칸의 태그가 이미 있음: 그 태그로 다시 만든다 (그 커밋으로 바꿔 받음)
      # - 수동 실행, 태그 칸이 비었거나 아직 없는 태그: 이 브랜치의 VERSION 으로 v<버전> 태그를 지금 커밋에 만들어 올린다
      #   (태그 칸에 쓴 값이 v<VERSION> 과 다르면 멈춤). GITHUB_TOKEN 으로 올린 태그는 이 워크플로를 다시 띄우지 않는다.
      - name: 태그 정하기
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          remote_commit() {   # 원격 태그가 가리키는 커밋 (없으면 빈 값, 주석 태그는 ^{} 가 커밋)
            local c
            c=$(git ls-remote --tags origin "refs/tags/$1^{}" | cut -f1)
            [[ -n "$c" ]] || c=$(git ls-remote --tags origin "refs/tags/$1" | cut -f1)
            echo "$c"
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            T="$GITHUB_REF_NAME"
          else
            V="v$(tr -d '\r\n' < VERSION)"
            T="${INPUT_TAG:-$V}"
            existing=$(remote_commit "$T")
            if [[ -n "$existing" && -n "$INPUT_TAG" ]]; then
              echo "$T 태그로 다시 만들어요 ($existing)."
              git fetch --force origin "refs/tags/$T:refs/tags/$T"
              git checkout --force --detach "$T"
            elif [[ -n "$existing" ]]; then
              if [[ "$existing" != "$GITHUB_SHA" ]]; then
                echo "::error::$T 태그가 이미 다른 커밋($existing)에 있어요. VERSION 을 올리거나, 그 태그로 다시 만들려면 태그 칸에 $T 를 넣어 실행하세요."
                exit 1
              fi
              echo "$T 태그가 이미 이 커밋에 있어요. 그대로 릴리스합니다."
            else
              if [[ "$T" != "$V" ]]; then
                echo "::error::$T 태그가 없어요. 새로 만들 수 있는 태그는 이 브랜치 VERSION 의 $V 뿐이에요 (태그 칸을 비우거나 $V 로)."
                exit 1
              fi
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$T" -m "GodDB for Windows ${T#v}" "$GITHUB_SHA"
              git push origin "refs/tags/$T"
              echo "$T 태그를 만들었어요 ($GITHUB_SHA)."
            fi
          fi
          echo "TAG=$T" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 버전 확인 (태그 = VERSION 파일)
        shell: bash
        run: |
          V="${TAG#v}"
          F="$(tr -d '\r\n' < VERSION)"
          if [[ "$V" != "$F" ]]; then echo "태그 $TAG 와 VERSION 파일($F)이 달라요"; exit 1; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          # Velopack 은 SemVer(세 자리)만 받는다. Windows 판 수정판 a.b.c.d 는 패키지 번호를 a.b.(c+1)-r.d 로
          # (업데이트 순서: 1.3.7 < 1.3.8-r.1 < 1.3.8). 화면 · 릴리스 이름 · 태그는 a.b.c.d 그대로.
          IFS=. read -r A B C D <<< "$V"
          if [[ -n "$D" ]]; then P="$A.$B.$((C + 1))-r.$D"; else P="$V"; fi
          echo "PACK_VERSION=$P" >> "$GITHUB_ENV"
          echo "패키지 번호: $P"

      - name: 빌드 (win-x64, self-contained)
        run: dotnet publish src/GodDB.App/GodDB.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -o publish

      - name: 회사 정보 확인
        shell: bash
        env:
          FORBIDDEN: ${{ secrets.FORBIDDEN_WORDS_REGEX }}
        run: |
          if [[ -n "$FORBIDDEN" ]] && grep -rqaiE "$FORBIDDEN" publish/GodDB.dll publish/GodDB.Core.dll; then
            echo "금지 단어가 앱에 들어 있어요"; exit 1
          fi

      - name: Velopack 도구
        run: dotnet tool install -g vpk

      - name: 이전 릴리스 받기 (델타 업데이트용)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" || true

      # 코드 서명 (선택): Azure Trusted Signing 비밀 값이 있을 때만 서명한다. 없으면 서명 없이 만든다.
      - name: Azure 로그인 (코드 서명)
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 패키지 (Setup.exe · zip · 업데이트 파일)
        shell: bash
        env:
          SIGN_METADATA: ${{ secrets.AZURE_SIGNING_METADATA_JSON }}
        run: |
          ARGS=(pack --packId GodDB --packVersion "$PACK_VERSION" --packDir publish --mainExe GodDB.exe
                --packTitle GodDB --packAuthors zio0911 --outputDir Releases)
          if [[ -n "$SIGN_METADATA" ]]; then
            printf '%s' "$SIGN_METADATA" > "$RUNNER_TEMP/signing.json"
            ARGS+=(--azureTrustedSignFile "$RUNNER_TEMP/signing.json")
            echo "코드 서명: Azure Trusted Signing"
          else
            echo "::warning::코드 서명 없이 만들어요 (처음 실행 시 SmartScreen 경고)"
          fi
          vpk "${ARGS[@]}"
          ls -la Releases

      - name: 릴리스 노트
        shell: bash
        run: ./scripts/release-notes.sh "$APP_VERSION" > "$RUNNER_TEMP/notes.md"

      - name: GitHub 릴리스
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" \
            --tag "$TAG" --releaseName "GodDB for Windows $APP_VERSION" --publish --merge -o Releases
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
